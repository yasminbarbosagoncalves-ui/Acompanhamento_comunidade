{% extends "base.html" %}

{% block conteudo %}

<div class="d-flex justify-content-between align-items-center mb-4">
    <div>
        <h2 class="text-dark-teal fw-bold mb-1">Registrar Alteração de Status</h2>
        <p class="text-muted mb-0">Atualize o andamento de uma solicitação existente</p>
    </div>
    <a href="{{ url_for('listar_historico') }}" class="btn btn-outline-secondary">
        <i class="bi bi-arrow-left me-2"></i>Voltar
    </a>
</div>

<div class="card card-custom p-4">
    <form method="POST" action="{{ url_for('cadastrar_historico') }}">
        
        <div class="row g-4 mb-3">
            <div class="col-md-6">
                <label class="form-label fw-semibold">Solicitação (Protocolo) <span class="text-danger">*</span></label>
                <select name="id_solicitacao" class="form-select" required>
                    <option value="" disabled selected>Selecione a solicitação...</option>
                    {% for sol in solicitacoes %}
                        <option value="{{ sol.id_solicitacao }}">{{ sol.protocolo }}</option>
                    {% endfor %}
                </select>
            </div>
            <div class="col-md-6">
                <label class="form-label fw-semibold">Funcionário Responsável <span class="text-danger">*</span></label>
                <select name="id_funcionario" class="form-select" required>
                    <option value="" disabled selected>Selecione o funcionário...</option>
                    {% for func in funcionarios %}
                        <option value="{{ func.id_funcionario }}">{{ func.nome }}</option>
                    {% endfor %}
                </select>
            </div>
        </div>

        <div class="row g-4 mb-3">
            <div class="col-md-4">
                <label class="form-label fw-semibold">Status Anterior <span class="text-danger">*</span></label>
                <input type="text" name="status_anterior" class="form-control" placeholder="Ex: Recebida" required>
            </div>
            <div class="col-md-4">
                <label class="form-label fw-semibold">Novo Status <span class="text-danger">*</span></label>
                <input type="text" name="novo_status" class="form-control" placeholder="Ex: Em Execução" required>
            </div>
            <div class="col-md-4">
                <label class="form-label fw-semibold">Data da Alteração <span class="text-danger">*</span></label>
                <input type="date" name="data_alteracao" class="form-control" required>
            </div>
        </div>

        <div class="row g-4 mb-4">
            <div class="col-md-12">
                <label class="form-label fw-semibold">Observação (Opcional)</label>
                <textarea name="observacao" class="form-control" rows="3" placeholder="Descreva o motivo da alteração..."></textarea>
            </div>
        </div>

        <div class="d-flex justify-content-end gap-3 mt-4 pt-3 border-top">
            <a href="{{ url_for('listar_historico') }}" class="btn btn-light border px-4">Cancelar</a>
            <button type="submit" class="btn btn-teal px-5"><i class="bi bi-check-lg me-2"></i>Registrar Histórico</button>
        </div>

    </form>
</div>
{% endblock %}
