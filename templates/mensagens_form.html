{% extends "base.html" %}

{% block conteudo %}

<div class="d-flex justify-content-between align-items-center mb-4">
    <div>
        <h2 class="text-dark-teal fw-bold mb-1">Enviar Nova Mensagem</h2>
        <p class="text-muted mb-0">Registre um contato ou envie uma comunicação</p>
    </div>
    <a href="{{ url_for('listar_mensagens') }}" class="btn btn-outline-secondary">
        <i class="bi bi-arrow-left me-2"></i>Voltar
    </a>
</div>

<div class="card card-custom p-4">
    <form method="POST" action="{{ url_for('cadastrar_mensagem') }}">
        
        <div class="row g-4 mb-3">
            <div class="col-md-6">
                <label class="form-label fw-semibold">Nome do Remetente <span class="text-danger">*</span></label>
                <input type="text" name="nome_remetente" class="form-control" placeholder="Nome de quem está enviando" required>
            </div>
            <div class="col-md-6">
                <label class="form-label fw-semibold">E-mail do Remetente</label>
                <input type="email" name="email_remetente" class="form-control" placeholder="email@exemplo.com">
            </div>
        </div>

        <div class="row g-4 mb-3">
            <div class="col-md-8">
                <label class="form-label fw-semibold">Assunto <span class="text-danger">*</span></label>
                <input type="text" name="assunto" class="form-control" placeholder="Sobre o que é a mensagem?" required>
            </div>
            <div class="col-md-4">
                <label class="form-label fw-semibold">Status Inicial <span class="text-danger">*</span></label>
                <select name="status" class="form-select" required>
                    <option value="não lida" selected>Não Lida</option>
                    <option value="lida">Lida</option>
                </select>
            </div>
        </div>

        <div class="row g-4 mb-4">
            <div class="col-md-12">
                <label class="form-label fw-semibold">Mensagem <span class="text-danger">*</span></label>
                <textarea name="mensagem" class="form-control" rows="6" placeholder="Escreva a mensagem aqui..." required></textarea>
            </div>
        </div>

        <!-- Campo Oculto para Resposta (se necessário) -->
        <input type="hidden" name="resposta" value="">

        <div class="d-flex justify-content-end gap-3 mt-4 pt-3 border-top">
            <a href="{{ url_for('listar_mensagens') }}" class="btn btn-light border px-4">Cancelar</a>
            <button type="submit" class="btn btn-teal px-5"><i class="bi bi-send me-2"></i>Enviar Mensagem</button>
        </div>

    </form>
</div>
{% endblock %}
