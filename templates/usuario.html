{% extends "base.html" %}

{% block conteudo %}

<h2>Usuários Cadastrados</h2>

<p>
    <a href="/usuarios/novo">Cadastrar novo usuário</a>
</p>

<table border="1" cellpadding="8">
    <thead>
        <tr>
            <th>ID</th>
            <th>Nome</th>
            <th>Login</th>
            <th>Perfil</th>
        </tr>
    </thead>

    <tbody>
        {% for usuario in usuarios %}
        <tr>
            <td>{{ usuario.id_usuario }}</td>
            <td>{{ usuario.nome }}</td>
            <td>{{ usuario.login }}</td>
            <td>{{ usuario.perfil }}</td>
        </tr>
        {% endfor %}
    </tbody>
</table>

{% endblock %}
