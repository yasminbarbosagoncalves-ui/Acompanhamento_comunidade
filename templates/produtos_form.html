{% extends "base.html" %}

{% block conteudo %}

<div class="d-flex justify-content-between align-items-center mb-4">
    <div>
        <h2 class="text-dark-teal fw-bold mb-1">Cadastrar Novo Produto</h2>
        <p class="text-muted mb-0">Adicione um item ao estoque do sistema</p>
    </div>
    <a href="{{ url_for('listar_produtos') }}" class="btn btn-outline-secondary">
        <i class="bi bi-arrow-left me-2"></i>Voltar
    </a>
</div>

<div class="card card-custom p-4">
    <form method="POST" action="{{ url_for('cadastrar_produto') }}">
        
        <div class="row g-4 mb-3">
            <div class="col-md-8">
                <label class="form-label fw-semibold">Nome do Produto <span class="text-danger">*</span></label>
                <input type="text" name="nome" class="form-control" placeholder="Ex: Paracetamol 500mg" required>
            </div>
            <div class="col-md-4">
                <label class="form-label fw-semibold">Categoria</label>
                <input type="text" name="categoria" class="form-control" placeholder="Ex: Medicamentos">
            </div>
        </div>

        <div class="row g-4 mb-3">
            <div class="col-md-4">
                <label class="form-label fw-semibold">Preço (R$) <span class="text-danger">*</span></label>
                <div class="input-group">
                    <span class="input-group-text bg-light text-muted border-end-0">R$</span>
                    <input type="number" step="0.01" name="preco" class="form-control border-start-0" placeholder="0.00" value="0.00" required>
                </div>
            </div>
            <div class="col-md-4">
                <label class="form-label fw-semibold">Quantidade em Estoque <span class="text-danger">*</span></label>
                <input type="number" name="quantidade" class="form-control" placeholder="0" value="0" required>
            </div>
            <div class="col-md-4">
                <label class="form-label fw-semibold">Status Inicial <span class="text-danger">*</span></label>
                <select name="status" class="form-select" required>
                    <option value="ativo" selected>Ativo</option>
                    <option value="inativo">Inativo</option>
                </select>
            </div>
        </div>

        <div class="row g-4 mb-3">
            <div class="col-md-12">
                <label class="form-label fw-semibold">URL da Imagem (Opcional)</label>
                <input type="text" name="imagem" class="form-control" placeholder="https://link-da-imagem.com/foto.jpg">
            </div>
        </div>

        <div class="row g-4 mb-4">
            <div class="col-md-12">
                <label class="form-label fw-semibold">Descrição</label>
                <textarea name="descricao" class="form-control" rows="3" placeholder="Detalhes sobre o produto..."></textarea>
            </div>
        </div>

        <div class="d-flex justify-content-end gap-3 mt-4 pt-3 border-top">
            <a href="{{ url_for('listar_produtos') }}" class="btn btn-light border px-4">Cancelar</a>
            <button type="submit" class="btn btn-teal px-5"><i class="bi bi-check-lg me-2"></i>Salvar Produto</button>
        </div>

    </form>
</div>
{% endblock %}
