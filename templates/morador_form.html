{% extends "base.html" %}
{% block conteudo %}
<div class="form-container">
    <h2>Cadastrar novo morador</h2>
    <form method="POST" action="/moradores/novo">
        <div class="form-group">
            <label>Usuário Vinculado:</label>
            <select name="id_usuario" required>
                <option value="">Selecione...</option>
                {% for u in usuarios %}
                <option value="{{ u.id_usuario }}">{{ u.nome }}</option>
                {% endfor %}
            </select>
        </div>
        <div class="form-group"><label>Nome:</label><input type="text" name="nome" required></div>
        <div class="form-group"><label>CPF:</label><input type="text" name="cpf" required></div>
        <div class="form-group"><label>Telefone:</label><input type="text" name="telefone"></div>
        <div class="form-group"><label>E-mail:</label><input type="email" name="email"></div>
        <div class="form-group"><label>Endereço:</label><input type="text" name="endereco"></div>
        <button type="submit">Cadastrar morador</button>
    </form>
</div>
{% endblock %}
