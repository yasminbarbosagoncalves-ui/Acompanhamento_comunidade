{% extends "base.html" %}

{% block conteudo %}

<div class="d-flex justify-content-between align-items-center mb-4">
    <div>
        <h2 class="text-dark-teal fw-bold mb-1">{{ 'Editar Morador' if morador is defined and morador else 'Cadastrar Novo Morador' }}</h2>
        <p class="text-muted mb-0">{{ 'Atualize os dados do cidadão' if morador is defined and morador else 'Vincule um usuário do sistema aos dados do cidadão' }}</p>
    </div>
    <a href="{{ url_for('listar_moradores') }}" class="btn btn-outline-secondary">
        <i class="bi bi-arrow-left me-2"></i>Voltar
    </a>
</div>

<div class="card card-custom p-4">
    <form method="POST" action="{{ url_for('editar_morador', id=morador.id_morador) if morador is defined and morador else url_for('cadastrar_morador') }}">
        
        <div class="row g-4 mb-3">
            <div class="col-md-6">
                <label class="form-label fw-semibold">Usuário Vinculado <span class="text-danger">*</span></label>
                <select name="id_usuario" class="form-select" required>
                    <option value="" disabled {{ 'selected' if not (morador is defined and morador) else '' }}>Selecione o usuário...</option>
                    {% for usuario in usuarios %}
                        <option value="{{ usuario.id_usuario }}" {{ 'selected' if morador is defined and morador and morador.id_usuario == usuario.id_usuario else '' }}>{{ usuario.nome }}</option>
                    {% endfor %}
                </select>
            </div>
            <div class="col-md-6">
                <label class="form-label fw-semibold">Nome Completo <span class="text-danger">*</span></label>
                <input type="text" name="nome" class="form-control" placeholder="Nome do morador" value="{{ morador.nome if morador is defined and morador else '' }}" required>
            </div>
        </div>

        <div class="row g-4 mb-3">
            <div class="col-md-4">
                <label class="form-label fw-semibold">CPF <span class="text-danger">*</span></label>
                <input type="text" name="cpf" class="form-control" placeholder="000.000.000-00" value="{{ morador.cpf if morador is defined and morador else '' }}" required>
            </div>
            <div class="col-md-4">
                <label class="form-label fw-semibold">Telefone</label>
                <input type="text" name="telefone" class="form-control" placeholder="(11) 99999-9999" value="{{ morador.telefone if morador is defined and morador and morador.telefone else '' }}">
            </div>
            <div class="col-md-4">
                <label class="form-label fw-semibold">E-mail</label>
                <input type="email" name="email" class="form-control" placeholder="email@exemplo.com" value="{{ morador.email if morador is defined and morador and morador.email else '' }}">
            </div>
        </div>

        <div class="row g-4 mb-4">
            <div class="col-md-12">
                <label class="form-label fw-semibold">Endereço Completo</label>
                <input type="text" name="endereco" class="form-control" placeholder="Rua, número, bairro..." value="{{ morador.endereco if morador is defined and morador and morador.endereco else '' }}">
            </div>
        </div>

        <div class="d-flex justify-content-end gap-3 mt-4 pt-3 border-top">
            <a href="{{ url_for('listar_moradores') }}" class="btn btn-light border px-4">Cancelar</a>
            <button type="submit" class="btn btn-teal px-5">
                <i class="bi bi-check-lg me-2"></i>{{ 'Atualizar' if morador is defined and morador else 'Salvar Morador' }}
            </button>
        </div>

    </form>
</div>
{% endblock %}
