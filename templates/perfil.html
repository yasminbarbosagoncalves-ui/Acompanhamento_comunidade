{% extends "base.html" %}

{% block conteudo %}

<div class="d-flex justify-content-between align-items-center mb-4">
    <div>
        <h2 class="text-dark-teal fw-bold mb-1">Meu Perfil</h2>
        <p class="text-muted mb-0">Visualize suas informações de acesso</p>
    </div>
</div>

<div class="row g-4">
    <!-- Cartão de Informações -->
    <div class="col-md-8">
        <div class="card card-custom p-4">
            <h5 class="text-dark-teal fw-bold mb-4"><i class="bi bi-person-vcard me-2"></i>Informações Pessoais</h5>
            
            <div class="row mb-3">
                <div class="col-md-6">
                    <label class="text-muted small fw-bold text-uppercase">Nome Completo</label>
                    <p class="fs-5 fw-semibold mb-0">{{ usuario.nome }}</p>
                </div>
                <div class="col-md-6">
                    <label class="text-muted small fw-bold text-uppercase">Login de Acesso</label>
                    <p class="fs-5 fw-semibold mb-0">@{{ usuario.login }}</p>
                </div>
            </div>

            <div class="row">
                <div class="col-md-6">
                    <label class="text-muted small fw-bold text-uppercase">Perfil do Sistema</label>
                    <p class="mb-0">
                        <span class="badge bg-teal rounded-pill px-3 py-2 fs-6">{{ usuario.perfil }}</span>
                    </p>
                </div>
                <div class="col-md-6">
                    <label class="text-muted small fw-bold text-uppercase">ID do Usuário</label>
                    <p class="fs-5 fw-semibold mb-0">#{{ usuario.id_usuario }}</p>
                </div>
            </div>
        </div>
    </div>

    <!-- Cartão Lateral de Avatar -->
    <div class="col-md-4">
        <div class="card card-custom p-4 text-center h-100 d-flex flex-column justify-content-center">
            <div class="bg-teal text-white rounded-circle d-inline-flex align-items-center justify-content-center mx-auto mb-3 shadow" style="width: 100px; height: 100px;">
                <i class="bi bi-person fs-1"></i>
            </div>
            <h5 class="fw-bold text-dark-teal mb-1">{{ usuario.nome }}</h5>
            <p class="text-muted small mb-0">{{ usuario.perfil }}</p>
        </div>
    </div>
</div>

{% endblock %}
