<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Acompanhamento Comunitário</title>
    
    <!-- Bootstrap e Ícones -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <!-- Seu CSS Customizado -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">

    <style>
        body {
            /* Fundo da tela de login (imagem da cidade com um filtro azul escuro) */
            background: linear-gradient(rgba(9, 58, 76, 0.85), rgba(15, 139, 141, 0.85)), url('https://images.unsplash.com/photo-1486406146926-c627a92ad1ab?q=80&w=2070&auto=format&fit=crop') center/cover;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0;
        }
        .caixa-login {
            background: #fff;
            padding: 40px 35px;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            width: 100%;
            max-width: 420px;
        }
    </style>
</head>
<body>

    <div class="caixa-login">
        <div class="text-center mb-4">
            <div class="bg-teal text-white rounded-circle d-inline-flex align-items-center justify-content-center mb-3 shadow" style="width: 65px; height: 65px;">
                <i class="bi bi-buildings fs-2"></i>
            </div>
            <h1 class="fw-bold text-dark-teal fs-3">Acompanhamento</h1>
            <p class="text-muted">Acesse com seu login e senha</p>
        </div>

        {% if erro %}
            <div class="alert alert-danger text-center" role="alert">
                <i class="bi bi-exclamation-triangle-fill me-2"></i>{{ erro }}
            </div>
        {% endif %}

        <form method="POST" action="{{ url_for('login') }}">
            <div class="mb-3">
                <label for="login" class="form-label fw-semibold text-muted">Login</label>
                <input type="text" id="login" name="login" class="form-control" placeholder="Digite seu login" required autofocus>
            </div>

            <div class="mb-4">
                <label for="senha" class="form-label fw-semibold text-muted">Senha</label>
                <input type="password" id="senha" name="senha" class="form-control" placeholder="Digite sua senha" required>
            </div>

            <button type="submit" class="btn btn-teal w-100 py-3 fw-bold shadow-sm">
                Entrar no Sistema
            </button>
        </form>
    </div>

</body>
</html>
